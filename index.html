<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=https://marzi44.github.io/keimbook/">
<meta name="referrer" content="no-referrer">
<title>KeimBook ist umgezogen</title>
<link rel="canonical" href="https://marzi44.github.io/keimbook/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F3EF; color: #16181A;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0E0F10; color: #EDEEEF; } }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 0 0 20px; opacity: .75; }
  a { display: inline-block; background: #1F5C50; color: #fff; text-decoration: none; padding: 14px 22px; border-radius: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <h1>KeimBook ist umgezogen</h1>
    <p>Das Klassenbuch heißt jetzt KeimBook und hat eine neue Adresse.</p>
    <a href="https://marzi44.github.io/keimbook/">Weiter zu KeimBook</a>
  </div>
<script>
  // Alte installierte Apps: Offline-Speicher der alten Adresse abmelden, damit sie nicht mehr die alte Version zeigen.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/klassenbuch/')) r.unregister(); })).catch(() => {});
  location.replace('https://marzi44.github.io/keimbook/');
</script>
</body>
</html>
